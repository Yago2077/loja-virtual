<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Pedido · Minha Loja</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="checkout">
    <header id="app-header"></header>

    <main class="section" style="padding-top: 40px">
      <div
        class="container"
        style="
          display: grid;
          grid-template-columns: 1fr 380px;
          gap: 32px;
          align-items: start;
        "
      >
        <div>
          <div class="checkout-card">
            <h2>1. Seus itens</h2>
            <div id="checkoutItems"></div>
          </div>

          <div class="checkout-card">
            <h2>2. Dados Pessoais</h2>
            <div class="form-row">
              <div class="field">
                <label>Nome *</label
                ><input id="cNome" placeholder="Nome completo" />
              </div>
              <div class="field">
                <label>CPF *</label
                ><input id="cCpf" placeholder="000.000.000-00" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>E-mail *</label
                ><input id="cEmail" type="email" placeholder="seu@email.com" />
              </div>
              <div class="field">
                <label>WhatsApp *</label
                ><input id="cFone" placeholder="(19) 99999-9999" />
              </div>
            </div>
          </div>

          <div class="checkout-card">
            <h2>3. Endereço de Entrega</h2>
            <div class="form-row">
              <div class="field">
                <label>CEP *</label><input id="cCep" placeholder="00000-000" />
              </div>
              <div class="field">
                <label>Rua *</label><input id="cEnd" placeholder="Logradouro" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Número *</label><input id="cNum" placeholder="123" />
              </div>
              <div class="field">
                <label>Bairro *</label
                ><input id="cBairro" placeholder="Centro" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Cidade *</label
                ><input id="cCidade" placeholder="São Paulo" />
              </div>
              <div class="field">
                <label>UF *</label
                ><input id="cUF" placeholder="SP" maxlength="2" />
              </div>
            </div>
            <div class="field">
              <label>Complemento</label
              ><input id="cComp" placeholder="Apto, bloco..." />
            </div>
          </div>

          <div class="checkout-card">
            <h2>4. Pagamento</h2>
            <div
              class="pay-grid"
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-bottom: 20px;
              "
            >
              <label
                class="checkout-card"
                style="
                  padding: 16px;
                  margin: 0;
                  display: flex;
                  gap: 10px;
                  cursor: pointer;
                "
              >
                <input type="radio" name="payTiming" value="online" />
                <div>
                  <strong>Pagar Agora</strong><br /><small>Via PIX</small>
                </div>
              </label>
              <label
                class="checkout-card"
                style="
                  padding: 16px;
                  margin: 0;
                  display: flex;
                  gap: 10px;
                  cursor: pointer;
                "
              >
                <input type="radio" name="payTiming" value="entrega" />
                <div>
                  <strong>Na Entrega</strong><br /><small
                    >PIX, Cartão, Dinheiro</small
                  >
                </div>
              </label>
            </div>

            <div id="methodSection" style="display: none">
              <div
                id="methodContainer"
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px"
              ></div>
            </div>
          </div>
        </div>

        <aside>
          <div class="checkout-card" style="position: sticky; top: 100px">
            <h2>Resumo</h2>
            <div id="summaryItems"></div>
            <div class="recibo-item" style="margin-top: 12px">
              <span>Subtotal</span><span id="subTotal">R$ 0,00</span>
            </div>
            <div class="recibo-item"><span>Frete</span><span>Grátis</span></div>
            <div class="recibo-total">
              <span>Total</span><span id="summaryTotal">R$ 0,00</span>
            </div>
            <button
              class="btn btn-block"
              id="confirmBtn"
              style="margin-top: 24px"
              disabled
            >
              Confirmar Pedido
            </button>
          </div>
        </aside>
      </div>
    </main>

    <footer id="app-footer"></footer>
    <aside class="cart-drawer" id="cartDrawer"></aside>
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
      <div class="modal-box" id="modalBox"></div>
    </div>

    <!-- MODAL PIX -->
    <div class="modal" id="pixModal">
      <div class="modal-box" style="text-align: center">
        <button class="modal-close" onclick="fecharModalPix()">✕</button>
        <h2 style="margin-bottom: 16px">Pague com PIX</h2>
        <img id="pixQRCode" src="" class="pix-qr-img" />
        <p class="muted" style="margin-bottom: 12px">
          Ou copie o código abaixo:
        </p>
        <div class="pix-copia-cola-wrap">
          <input id="pixCopiaCola" type="text" readonly />
          <button class="btn" onclick="copiarPix()">Copiar</button>
        </div>
        <p
          id="pixStatus"
          style="margin-top: 20px; font-weight: 700; color: var(--destaque)"
        >
          Aguardando pagamento...
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
