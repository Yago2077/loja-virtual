<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato · Minha Loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="contato">
    <header id="app-header"></header>
    <main class="section">
      <div class="container" style="max-width: 800px;">
        <h1 class="text-center" style="margin-bottom: 32px;">Fale conosco</h1>
        <div class="checkout-card">
          <form id="contatoForm">
            <div class="form-row">
              <div class="field"><label>Seu Nome</label><input name="nome" required placeholder="Como podemos te chamar?"></div>
              <div class="field"><label>Seu E-mail</label><input name="email" type="email" required placeholder="seu@email.com"></div>
            </div>
            <div class="field">
              <label>Assunto</label>
              <select name="assunto">
                <option>Dúvida sobre produto</option>
                <option>Status do meu pedido</option>
                <option>Troca ou devolução</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="field">
              <label>Mensagem</label>
              <textarea name="msg" rows="6" required placeholder="Escreva detalhadamente..."></textarea>
            </div>
            <button class="btn btn-block" type="submit">Enviar Mensagem</button>
          </form>
        </div>
      </div>
    </main>
    <footer id="app-footer"></footer>
    <aside class="cart-drawer" id="cartDrawer"></aside>
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
