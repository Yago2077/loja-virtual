<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos · Minha Loja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="produtos">
    <header id="app-header"></header>

    <main>
      <section class="page-head">
        <div class="container">
          <h1>Nossos produtos</h1>
          <p class="muted">Filtre por categoria ou busque pelo nome.</p>
        </div>
      </section>

      <section class="section" style="padding-top: 24px">
        <div class="container">
          <div class="filters">
            <div class="search-wrap">
              <span class="search-ico">🔍</span>
              <input type="search" id="busca" placeholder="Buscar produto..." />
            </div>
            <select id="categoria">
              <option value="">Todas as categorias</option>
            </select>
          </div>
          <p class="muted" id="contador" style="margin-bottom: 16px"></p>
          <div class="grid" id="produtosGrid"></div>
          <p id="vazio" class="vazio" hidden>Nenhum produto encontrado.</p>
        </div>
      </section>
    </main>

    <footer id="app-footer"></footer>
    <aside class="cart-drawer" id="cartDrawer" aria-hidden="true"></aside>
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-box" id="modalBox"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
