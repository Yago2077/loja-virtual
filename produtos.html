<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos · Minha Loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="produtos">
    <header id="app-header"></header>

    <main class="section" style="padding-top: 40px;">
      <div class="container">
        <h1 style="margin-bottom: 24px;">Nossos produtos</h1>
        
        <!-- BARRA DE BUSCA E FILTRO -->
        <div style="display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap;">
          <div class="field" style="flex: 1; min-width: 250px; margin-bottom: 0; position: relative;">
            <svg width="20" height="20" fill="none" stroke="var(--muted)" stroke-width="2" viewBox="0 0 24 24" style="position: absolute; left: 16px; top: 16px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Buscar produto..." style="border-radius: 999px; padding: 16px 20px 16px 48px;">
          </div>
          <div class="field" style="width: 250px; margin-bottom: 0;">
            <select id="categorySelect" style="border-radius: 999px; padding: 16px 20px;">
              <option value="">Todas as categorias</option>
            </select>
          </div>
        </div>

        <div class="grid" id="productsGrid"></div>
        
        <p id="noProducts" class="text-center muted" style="display: none; padding: 60px 0; font-size: 1.1rem;">
          Nenhum produto encontrado com esses filtros.
        </p>
      </div>
    </main>

    <footer id="app-footer"></footer>
    <aside class="cart-drawer" id="cartDrawer"></aside>
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
